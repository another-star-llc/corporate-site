version: '3.8'

services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # ソースコードをマウント（ホットリロード対応）
      - .:/app
      # node_modulesは除外（コンテナ内のものを使用）
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    # ファイル変更の監視を有効にする
    command: pnpm run dev --host 0.0.0.0

  # 本番ビルド用のサービス（オプション）
  build:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm run build
    profiles:
      - build

